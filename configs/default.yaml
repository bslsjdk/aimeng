project:
  name: aimeng-gguf-router
  schema_version: 1

model:
  source: huggingface
  repo_id: ornith-ai/Ornith-1.5-9B-GGUF
  filename: Ornith-1.5-9B-Q4_K_M.gguf
  path_env: AIMENG_MODEL_GGUF
  expected_family: qwen35
  expected_parameters_billions: 9
  expected_quantization: Q4_K_M
  sha256_required_for_reproducible_runs: true
  role: frozen_teacher_and_inference_baseline
  train_quantized_gguf_weights_directly: false

runtime_constraints:
  # Whole Android application hard ceiling, not a target to fill.
  whole_app_runtime_hard_limit_mib: 4096
  safety_headroom_mib: 384
  max_concurrent_generation_tasks: 1
  adaptive_context: true
  allow_router_to_disable_safety_limit: false

budget_profiles:
  # Experimental llama.cpp request values. Confirm support with the exact backend
  # build and benchmark on the target device before treating these as calibrated.
  small:
    n_ctx: 1024
    max_tokens: 128
    n_batch: 64
    threads: 4
  medium:
    n_ctx: 2048
    max_tokens: 256
    n_batch: 128
    threads: 4
  full:
    n_ctx: 4096
    max_tokens: 512
    n_batch: 256
    threads: 4

routing:
  # Phase 1 uses only real backend controls; channel skipping is deferred until proven.
  first_experiment: dynamic_budget_parameter_sweep
  enabled_actions:
    - n_ctx
    - max_tokens
    - threads
    - concurrency
    - n_batch
  expansion_on_uncertainty: true
  fallback_to_full_path_if_quality_gate_fails: true
  full_path_requires_resource_safety: true
  abort_if_no_safe_path: true
  structured_ffn_channel_groups:
    enabled: false
    group_size: null
    candidate_pool_schedule: [0.125, 0.25, 0.5, 0.75, 1.0]
    require_verified_backend_skip: true
    never_assume_skipped_channels_reduce_memory_without_backend_measurement: true

reward:
  quality_gate_required: true
  optimize:
    - task_quality
    - measured_latency
    - measured_peak_memory
    - measured_compute
  unverified_self_confidence_is_not_ground_truth: true

evaluation:
  require_full_model_baseline: true
  require_held_out_tasks: true
  record_peak_rss: true
  record_peak_pss_when_available: true
  record_first_token_latency: true
  record_tokens_per_second: true
  record_task_success_rate: true
  record_backend_and_driver_versions: true
