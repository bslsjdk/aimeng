name: Leakage-resistant evaluation tests

on:
  push:
    branches: [feat/leakage-resistant-evaluation]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test runtime
        run: python -m pip install --upgrade pip torch
      - name: Syntax check
        run: python -m compileall -q scripts tests
      - name: Run sparse diffusion tests
        run: python -m unittest tests.test_diffusion_text -v
