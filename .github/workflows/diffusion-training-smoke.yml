name: Sparse diffusion staged training

on:
  push:
    branches: [feat/sparse-diffusion-text-trainer, feat/mobile-diffusion-export]
  pull_request:
    branches: [feat/neuro-inspired-bounded-runtime, feat/sparse-diffusion-text-trainer]
  workflow_dispatch:
    inputs:
      level:
        description: "Experiment level. Start with A; only advance after reviewing the report."
        type: choice
        required: true
        default: A
        options:
          - A
          - B
          - C
          - D
          - E
      steps:
        description: "Training steps for the first speech-quality attempt (50,000 default)"
        type: string
        required: true
        default: "50000"
      corpus_path:
        description: "Optional UTF-8 corpus file already committed to this branch. Blank automatically prepares up to 50,000 Chinese instruction/answer examples from BelleGroup/train_0.5M_CN."
        type: string
        required: false
        default: ""
      confirm_large_experiment:
        description: "Required for level E (100,000 neurons); only enable after A-D show measurable benefit."
        type: boolean
        required: true
        default: false

concurrency:
  group: diffusion-training-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  train-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU training runtime
        run: python -m pip install --upgrade pip torch datasets
      - name: Unit tests
        run: python -m unittest tests.test_diffusion_text tests.test_prepare_speaking_corpus tests.test_export_mobile_diffusion -v
      - name: Select staged experiment
        id: config
        shell: bash
        env:
          LEVEL: ${{ inputs.level || 'A' }}
          REQUESTED_STEPS: ${{ inputs.steps || '50000' }}
          CORPUS_PATH: ${{ inputs.corpus_path || '' }}
          CONFIRM_LARGE: ${{ inputs.confirm_large_experiment || 'false' }}
        run: |
          set -euo pipefail
          case "$LEVEL" in
            A) NEURONS=128; ACTIVE_K=8 ;;
            B) NEURONS=512; ACTIVE_K=16 ;;
            C) NEURONS=2048; ACTIVE_K=64 ;;
            D) NEURONS=8192; ACTIVE_K=256 ;;
            E)
              if [ "$CONFIRM_LARGE" != "true" ]; then
                echo "Level E is gated. Review successful A-D reports first, then explicitly confirm." >&2
                exit 2
              fi
              NEURONS=100000; ACTIVE_K=500
              ;;
            *) echo "Unknown experiment level: $LEVEL" >&2; exit 2 ;;
          esac
          if ! [[ "$REQUESTED_STEPS" =~ ^[1-9][0-9]*$ ]]; then
            echo "steps must be a positive integer" >&2
            exit 2
          fi
          if [ "$LEVEL" = "E" ] && [ "$REQUESTED_STEPS" -gt 1000 ]; then
            echo "Level E is capped at 1000 steps per GitHub Actions run; use a dedicated larger-memory experiment only after this probe." >&2
            exit 2
          fi
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"
          echo "neurons=$NEURONS" >> "$GITHUB_OUTPUT"
          echo "active_k=$ACTIVE_K" >> "$GITHUB_OUTPUT"
          echo "steps=$REQUESTED_STEPS" >> "$GITHUB_OUTPUT"
          echo "corpus_path=$CORPUS_PATH" >> "$GITHUB_OUTPUT"
          echo "Selected level $LEVEL: neurons=$NEURONS active_k=$ACTIVE_K steps=$REQUESTED_STEPS"
      - name: Validate optional corpus
        if: github.event_name == 'workflow_dispatch'
        if: ${{ steps.config.outputs.corpus_path != '' }}
        env:
          CORPUS_PATH: ${{ steps.config.outputs.corpus_path }}
        run: test -s "$CORPUS_PATH"
      - name: Train selected experiment
        if: github.event_name == 'workflow_dispatch'
        env:
          LEVEL: ${{ steps.config.outputs.level }}
          NEURONS: ${{ steps.config.outputs.neurons }}
          ACTIVE_K: ${{ steps.config.outputs.active_k }}
          STEPS: ${{ steps.config.outputs.steps }}
          CORPUS_PATH: ${{ steps.config.outputs.corpus_path }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "runs/level-$LEVEL"
          ARGS=(--steps "$STEPS" --neurons "$NEURONS" --width 32 --active-k "$ACTIVE_K" --fanout 8 --max-steps 6 --memory-stop-mib 2560 --output "runs/level-$LEVEL" --log-every 100)
          if [ -n "$CORPUS_PATH" ]; then
            ARGS+=(--text "$CORPUS_PATH")
          else
            python scripts/prepare_speaking_corpus.py --output "runs/level-$LEVEL/language_corpus.txt" --max-records 50000
            ARGS+=(--text "runs/level-$LEVEL/language_corpus.txt")
          fi
          python scripts/train_diffusion_text.py "${ARGS[@]}"
      - name: Generate sample for manual speech-quality review
        if: github.event_name == 'workflow_dispatch'
        env:
          LEVEL: ${{ steps.config.outputs.level }}
        run: |
          python scripts/train_diffusion_text.py \
            --checkpoint "runs/level-$LEVEL/diffusion_checkpoint.pt" \
            --prompt '用户：你好，请用自然的中文介绍一下你自己。助手：' \
            --generate-tokens 160 --temperature 0.7 \
            > "runs/level-$LEVEL/generated_sample.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          level = os.environ["LEVEL"]
          p = Path(f"runs/level-{level}/generated_sample.json")
          sample = json.loads(p.read_text(encoding="utf-8"))
          assert sample.get("generated_text") and sample.get("checkpoint_source") == "user_corpus"
          print("Generated sample saved for human review; this is not an automatic language-quality pass.")
          print(sample["generated_text"])
          PY
      - name: Export portable JSON and new binary Android import file
        if: github.event_name == 'workflow_dispatch'
        env:
          LEVEL: ${{ steps.config.outputs.level }}
        run: |
          set -euo pipefail
          python scripts/export_mobile_diffusion.py \
            --checkpoint "runs/level-$LEVEL/diffusion_checkpoint.pt" \
            --output "runs/level-$LEVEL/mobile_diffusion.json" \
            --binary-output "runs/level-$LEVEL/mobile_diffusion.aimg"
          python - <<'PY'
          import gzip, hashlib, json, os, struct
          from pathlib import Path
          root = Path(f"runs/level-{os.environ['LEVEL']}")
          p = root / "mobile_diffusion.json"
          bundle = json.loads(p.read_text(encoding="utf-8"))
          assert bundle["format"] == "aimeng-mobile-diffusion-json-v1"
          assert bundle["tensors"] and bundle["itos"]
          packed = (root / "mobile_diffusion.aimg").read_bytes()
          assert packed[:4] == b"AIMG", "missing AIMG magic"
          version, size = struct.unpack(">II", packed[4:12])
          raw = gzip.decompress(packed[44:])
          assert version == 1 and len(raw) == size
          assert hashlib.sha256(raw).digest() == packed[12:44]
          assert json.loads(raw)["format"] == bundle["format"]
          print(f"Portable JSON validated: {p.stat().st_size} bytes")
          print(f"New Android import validated: {len(packed)} bytes, AIMG v{version}")
          PY
      - name: Upload checkpoint, portable bundle, speech sample and report
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: aimeng-diffusion-level-${{ steps.config.outputs.level }}-${{ github.run_number }}
          path: runs/level-${{ steps.config.outputs.level }}/
          if-no-files-found: error
          retention-days: 14
