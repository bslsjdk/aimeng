name: AIMENG-MC synthetic data generator

on:
  push:
    paths:
      - "scripts/generate_aimeng_mc_data.py"
      - "docs/AIMENG_MC_TRAINING_DATA.md"
      - ".github/workflows/aimeng-mc-data-generator.yml"
  pull_request:
    paths:
      - "scripts/generate_aimeng_mc_data.py"
      - ".github/workflows/aimeng-mc-data-generator.yml"
  workflow_dispatch:

jobs:
  validate-generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check syntax
        run: python -m py_compile scripts/generate_aimeng_mc_data.py
      - name: Check schema and reproducibility
        run: python scripts/generate_aimeng_mc_data.py --self-test
      - name: Generate small smoke dataset
        run: |
          python scripts/generate_aimeng_mc_data.py --episodes 10 --seed 424242 --output /tmp/aimeng_mc_smoke.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("/tmp/aimeng_mc_smoke.jsonl")
          rows = [json.loads(line) for line in path.read_text().splitlines()]
          assert rows, "no records generated"
          assert all(len(row["observation"]["voxels"]) == 405 for row in rows)
          assert all(row["schema"] == "aimeng-mc-step-v1" for row in rows)
          print(f"validated {len(rows)} records")
          PY
