name: Idea Cycle and Plasticity Contracts

on:
  push:
    branches: [feat/teacher-knowledge-seed-batch]
    paths:
      - "scripts/idea_cycle_state.py"
      - "scripts/validate_idea_records.py"
      - "scripts/validate_plastic_module.py"
      - "schemas/idea_record.schema.json"
      - "schemas/plastic_module.schema.json"
      - "schemas/task_state.schema.json"
      - "tests/test_idea_records.py"
      - "tests/test_idea_cycle_state.py"
      - "tests/test_plastic_module_manifest.py"
      - ".github/workflows/idea-cycle-tests.yml"
  pull_request:
    paths:
      - "scripts/idea_cycle_state.py"
      - "scripts/validate_idea_records.py"
      - "scripts/validate_plastic_module.py"
      - "schemas/idea_record.schema.json"
      - "schemas/plastic_module.schema.json"
      - "schemas/task_state.schema.json"
      - "tests/test_idea_records.py"
      - "tests/test_idea_cycle_state.py"
      - "tests/test_plastic_module_manifest.py"
      - ".github/workflows/idea-cycle-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate JSON schemas parse
        run: |
          python -m json.tool schemas/idea_record.schema.json >/dev/null
          python -m json.tool schemas/plastic_module.schema.json >/dev/null
          python -m json.tool schemas/task_state.schema.json >/dev/null
      - name: Run idea record contract tests
        run: python -m unittest discover -s tests -p 'test_idea_records.py'
      - name: Run durable state machine tests
        run: python -m unittest discover -s tests -p 'test_idea_cycle_state.py'

      - name: Run plastic module manifest gate tests
        run: python -m unittest discover -s tests -p 'test_plastic_module_manifest.py'
